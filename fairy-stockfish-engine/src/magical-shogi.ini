# Magical Shogi base variant.
#
# The SPECIAL moves (Nanoka shot, Hiro swap, and Margo jump assassination)
# are added in C++ and deliberately are not approximated here.  Hanna's float
# is a normal forward Dabbaba leap and therefore is represented exactly.

[magicalshogi]
variantTemplate = shogi
magicalShogi = true
maxRank = 6
maxFile = 6

# n Nanoka, h Hanna, i Hiro, k Emma, s Sherry, m Margo
# a-e are their promoted identities. Keeping separate promoted identities lets
# the C++ special-move generator preserve each character's magic after promotion.
customPiece1 = n:mfsWcfsWfcDfcA
customPiece2 = h:fKmfD
customPiece3 = i:fsW
king = k:K
customPiece4 = s:fmW2fcF
customPiece5 = m:fK
customPiece6 = a:KfcDfcA
customPiece7 = b:KmfD
customPiece8 = c:K
customPiece9 = d:KfW2
customPiece10 = e:K

# Preserve the relative material values used by the current Rust engine.
# Fairy-Stockfish's internal scale is roughly 2.5 times the existing values.
pieceValueMg = n:1150 h:1300 i:750 s:700 m:1500 a:1625 b:1775 c:1225 d:1175 e:1975
pieceValueEg = n:875 h:1300 i:750 s:700 m:1500 a:1350 b:1775 c:1225 d:1175 e:1975

startFen = mskihn/6/6/6/6/NHIKSM[-] w - - 0 1
pieceDrops = true
capturesToHand = true
dropLoop = false
castling = false
doubleStep = false

promotionRegionWhite = *5 *6
promotionRegionBlack = *1 *2
promotionPawnTypes = -
mandatoryPiecePromotion = true
promotedPieceType = n:a h:b i:c s:d m:e

# No piece may be dropped on the opponent's last rank.
dropRegionWhite = *1 *2 *3 *4 *5
dropRegionBlack = *2 *3 *4 *5 *6

# Emma wins only when she reaches the far rank safely.
flagPiece = k
flagRegionWhite = *6
flagRegionBlack = *1
flagPieceSafe = true

stalemateValue = loss
checkmateValue = loss
nFoldRule = 3
nFoldValue = draw
nMoveRule = 0
pocketSize = 5
